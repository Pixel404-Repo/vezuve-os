name: build-iso
on:
  workflow_dispatch:
jobs:
  build-iso:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@v9
      - name: Build ISO
        uses: jasonn3/build-container-installer@main
        id: build
        with:
          arch: x86_64
          image_name: vezuve-os
          image_repo: ghcr.io/pixel404-repo
          image_tag: latest
          version: "44"
          variant: Kinoite
          iso_name: vezuve-os.iso
      - name: Upload ISO
        uses: actions/upload-artifact@v7
        with:
          name: vezuve-os-iso
          path: |
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}-CHECKSUM
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
